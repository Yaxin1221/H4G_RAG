<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rights in Exile assistant</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; --line: #e2e2e2;
    --accent: #14532d; --bubble: #f4f4f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --fg:#ececec; --muted:#9a9a9a; --line:#2c2c2c;
            --accent:#7fd4a2; --bubble:#1f1f1f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system,
         BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 120px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.875rem; margin:0 0 24px; }
  .msg { margin:20px 0; }
  .msg.user { text-align:right; }
  .msg.user .body { display:inline-block; background:var(--bubble); padding:10px 14px;
                    border-radius:14px; text-align:left; max-width:85%; }
  .body { word-wrap:break-word; }
  .msg.user .body { white-space:pre-wrap; }
  .bot .body > :first-child { margin-top:0; }
  .bot .body > :last-child { margin-bottom:0; }
  .bot .body p { margin:.6em 0; }
  .bot .body h3 { margin:1.3em 0 .4em; padding-bottom:6px; font-size:1.0625rem;
                  border-bottom:2px solid var(--accent); }
  .bot .body h4 { margin:1.1em 0 .3em; font-size:.8125rem; text-transform:uppercase;
                  letter-spacing:.04em; color:var(--muted); }
  .bot .body ul, .bot .body ol { margin:.4em 0; padding-left:1.3em; }
  /* top-level items are cards; nested items are their detail rows */
  .bot .body > ul, .bot .body > ol { list-style:none; padding:0; }
  .bot .body > ul > li, .bot .body > ol > li { margin:10px 0; padding:10px 14px;
      background:var(--bubble); border:1px solid var(--line); border-left:3px solid var(--accent);
      border-radius:8px; }
  .bot .body > ul > li > ul, .bot .body > ol > li > ul { list-style:none; padding:0; margin:6px 0 0; }
  .bot .body li li { margin:3px 0; font-size:.9rem; color:var(--muted); }
  .bot .body li li ul { padding-left:1.2em; list-style:disc; }
  .bot .body a { color:var(--accent); text-decoration:underline; }
  .bot .body code { background:var(--bubble); padding:1px 4px; border-radius:4px; }
  .tool { color:var(--muted); font-size:.8125rem; font-style:italic; margin:6px 0; }
  .sources { margin-top:14px; padding-top:10px; border-top:1px solid var(--line);
             font-size:.8125rem; }
  .sources a { color:var(--accent); }
  .sources li { margin-bottom:6px; }
  form { position:fixed; bottom:0; left:0; right:0; background:var(--bg);
         border-top:1px solid var(--line); padding:12px 16px; }
  .row { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:10px;
          background:var(--bg); color:var(--fg); font-size:1rem; min-width:0; }
  button { padding:11px 18px; border:0; border-radius:10px; background:var(--accent);
           color:var(--bg); font-size:1rem; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  .disclaimer { color:var(--muted); font-size:.75rem; max-width:720px; margin:8px auto 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rights in Exile assistant</h1>
  <p class="sub">Answers come only from rightsinexile.org, with a link to every page used.
     Information, not legal advice.</p>
  <div id="thread"></div>
</div>

<form id="form">
  <div class="row">
    <input id="q" autocomplete="off" placeholder="e.g. Who provides legal aid to refugees in Jordan?">
    <button id="send" type="submit">Ask</button>
  </div>
  <p class="disclaimer">Contact details on the site may be out of date; each answer shows
     when its source page was last updated.</p>
</form>

<script>
const thread = document.getElementById("thread");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");
let history = [];

function esc(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
}

// Inline: escape first, then apply markup, so model output can never inject HTML.
function inline(t) {
  const stash = [];
  const keep = (h) => `\u0000${stash.push(h) - 1}\u0000`;
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${c}</code>`));
  t = t.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,
    (_, txt, url) => keep(`<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`));
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g,
    (_, pre, url) => pre + keep(`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`));
  t = t.replace(/(^|[\s(])([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/g,
    (_, pre, m) => pre + keep(`<a href="mailto:${m}">${m}</a>`));
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[+i]);
}

function markdown(src) {
  const out = [];
  let stack = [], para = [];          // stack of {kind, indent} for nested lists
  const flushPara = () => { if (para.length) out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`); para = []; };
  const closeTo = (n) => { while (stack.length > n) out.push(`</li></${stack.pop().kind}>`); };
  for (const line of src.split("\n")) {
    let m;
    if (!line.trim()) { flushPara(); closeTo(0); }
    else if ((m = line.match(/^(#{1,6})\s+(.*)/))) {
      flushPara(); closeTo(0);
      out.push(`<h${m[1].length < 3 ? 3 : 4}>${inline(m[2])}</h${m[1].length < 3 ? 3 : 4}>`);
    } else if ((m = line.match(/^(\s*)(?:[-*•]|(\d+)[.)])\s+(.*)/))) {
      flushPara();
      const indent = m[1].replace(/\t/g, "    ").length, kind = m[2] ? "ol" : "ul";
      while (stack.length && indent < stack[stack.length - 1].indent) out.push(`</li></${stack.pop().kind}>`);
      const top = stack[stack.length - 1];
      if (top && indent === top.indent) {
        if (top.kind === kind) out.push("</li>");
        else { out.push(`</li></${stack.pop().kind}>`); stack.push({ kind, indent }); out.push(`<${kind}>`); }
      } else { stack.push({ kind, indent }); out.push(`<${kind}>`); }
      out.push(`<li>${inline(m[3])}`);
    } else if (stack.length && /^\s+/.test(line)) {
      out.push(`<br>${inline(line.trim())}`);       // continuation line inside an item
    } else { closeTo(0); para.push(line); }
  }
  flushPara(); closeTo(0);
  return out.join("");
}

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  if (text) d.textContent = text;
  return d;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  send.disabled = true;

  const userMsg = el("msg user");
  userMsg.appendChild(el("body", question));
  thread.appendChild(userMsg);

  const botMsg = el("msg bot");
  const body = el("body", "");
  const tools = el("tool", "");
  botMsg.append(tools, body);
  thread.appendChild(botMsg);
  window.scrollTo(0, document.body.scrollHeight);

  const cites = new Map();
  let raw = "";
  const render = () => { body.innerHTML = markdown(raw); };
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);

    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data: ")) continue;
        const payload = part.slice(6);
        if (payload === "[DONE]") continue;
        const ev = JSON.parse(payload);
        if (ev.type === "text") {
          raw += ev.text; render();
        } else if (ev.type === "cite") {
          if (ev.url) cites.set(ev.url, ev.title || ev.url);
        } else if (ev.type === "tool") {
          const what = ev.args.country
            ? `${ev.args.country} — ${ev.args.category}`
            : (ev.args.query || ev.args.id_or_url || "");
          tools.textContent = `looking up ${what}…`;
        } else if (ev.type === "error") {
          raw += `\n\n[${ev.message}]`; render();
        } else if (ev.type === "done") {
          history = ev.history;
        }
        window.scrollTo(0, document.body.scrollHeight);
      }
    }
  } catch (err) {
    raw += `\n\n[${err.message}]`; render();
  }

  tools.remove();
  if (cites.size) {
    const box = el("sources");
    box.appendChild(el("", "Sources"));
    const ul = document.createElement("ul");
    for (const [url, title] of cites) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = title;
      li.appendChild(a);
      ul.appendChild(li);
    }
    box.appendChild(ul);
    botMsg.appendChild(box);
  }
  send.disabled = false;
  input.focus();
});
</script>
</body>
</html>
